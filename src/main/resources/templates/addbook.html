<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add book</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
    <h1>Add book</h1>
    <div>
    <form th:object="${book}" th:action="@{save}" action="#" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="author">Author</label>
        <input type="text" id="author" th:field="*{author}" />
        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" />
        <label for="isbn">ISBN</label>
        <input type="text" id="isbn" th:field="*{isbn}" />
        <label for="year">Year</label>
        <input type="text" id="year" th:field="*{publicationYear}" />

        <label for="catlist">Category</label>
        <select id="catlist" th:field="*{category.categoryid}" class="form-control" style="display: inline-block; width: 200px;">
            <option th:each="cat: ${categories}" th:value="${cat.categoryid}" th:text="${cat.name}"></option>
        </select>

        <input type="submit" value="Save" class="btn btn-success" />
    </form>
    </div>
</body>
</html>
