<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booklist</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <link rel="stylesheet" href="/css/home.css" th:href="@{/css/home.css}">
</head>
<body class="booklist-page">
    <header class="booklist-header">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="login-brand mb-0" th:href="@{/}">BOOKSTORE<span class="brand-dot">.</span></a>
            <div class="booklist-account">
                <span class="booklist-user" th:text="${username}"></span>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="submit" value="Sign Out" class="btn btn-outline-light" />
                </form>
            </div>
        </div>
    </header>

    <main class="container booklist-content">
        <div class="booklist-heading">
            <div>
                <p class="eyebrow">YOUR COLLECTION</p>
                <h1>Books <span>worth keeping.</span></h1>
            </div>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/add}" class="btn btn-coral">Add book</a>
        </div>

        <div class="table-responsive book-table-wrap">
            <table class="table book-table">
                <thead>
                    <tr>
                        <th scope="col">Author</th>
                        <th scope="col">Title</th>
                        <th scope="col">ISBN</th>
                        <th scope="col">Year</th>
                        <th scope="col">Category</th>
                        <th sec:authorize="hasAuthority('ROLE_ADMIN')" scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.author}"></td>
                        <td th:text="${book.title}"></td>
                        <td th:text="${book.isbn}"></td>
                        <td th:text="${book.publicationYear}"></td>
                        <td th:text="${book.category.name}"></td>
                        <td sec:authorize="hasAuthority('ROLE_ADMIN')" class="book-actions">
                            <a th:href="@{/delete/{id}(id=${book.id})}" class="btn btn-sm btn-danger">Delete</a>
                            <a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-sm btn-primary">Edit</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
