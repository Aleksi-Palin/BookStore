<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | BookStore</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" href="/css/home.css" th:href="@{/css/home.css}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <a class="login-brand" th:href="@{/}">BOOKSTORE<span class="brand-dot">.</span></a>
            <p class="eyebrow">WELCOME BACK</p>
            <h1 id="login-title">Sign in to<br><span>your shelf.</span></h1>

            <div class="login-error" th:if="${param.error}" role="alert">
                Invalid username and password.
            </div>

            <form class="login-form" th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="form-field">
                    <label for="username">User name</label>
                    <input id="username" type="text" name="username" autocomplete="username" required>
                </div>
                <div class="form-field">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-coral login-button" type="submit">Sign in</button>
            </form>
        </section>
    </main>
</body>
</html>
